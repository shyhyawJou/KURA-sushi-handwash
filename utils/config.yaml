camera:
    #crop_area: [0., 0., 1., 0.677662037037037]  # 0.25, 0.25, 0.75, 0.75
    #crop_area: [0., 0., 1., 0.7277]  # 0.25, 0.25, 0.75, 0.75
    crop_area: []
    wh: [1280, 960]
    video_path: 'video/20260417_2.mp4'
    max_fake_frames: 300  # for 影片檔, 當連續讀不到一定數量的 frame 時才跳出影片

streamer:
    enable: true
    host: '127.0.0.1'
    port: 9527
    route: /meal
    size: [640, 480]
    quality: 40

AI:
    handwash:
        #path: 'best_0.8380_0.9060_epoch_91_kura_v16.onnx'
        #path: 'best_0.8510_0.9030_epoch_56_kura_spray_alcohol_v2.onnx'
        #path: 'best_0.8830_0.9290_epoch_38_kura_spray_alcohol_v7.onnx'
        #path: 'best_0.9200_0.9680_epoch_8_kura_spray_alcohol_v11.onnx'
        #path: 'best_0.9160_0.9700_epoch_5_kura_spray_alcohol_v13.onnx'
        path: 'best_0.9220_0.9700_epoch_11_kura_spray_alcohol_v14.onnx'
        score_thresh: 0.5
        iou_thresh: 0.1
        input_wh: [448, 448]

        classes:
            - 'palm to palm'
            - 'palm over back'
            - 'interlaced fingers'
            - 'thumb or wrist scrub'
            - 'scrub under nails'
            #- 'alcohol nozzle'
            - 'gloved hand'
            - 'left'
            - 'right'
            #- 'nail brush'
            #- 'paper towel'
            #- 'air outlet'
            #- 'brush tray'
            #- 'faucet'
            #- 'sink'
            #- 'soap dispenser'
            - 'spray alcohol'
            - 'trigger soap dispenser'
            - 'wipe hands with tissue'
            - 'handwash'
            - 'UV sterilization'
        
        agnostic_nms:  # null 是 disable
            -
                class:
                    - 'palm to palm'
                    - 'palm over back'
                    - 'interlaced fingers'
                    - 'thumb or wrist scrub'
                    - 'scrub under nails'
                iou_thresh:
                    0.1
            #- 
            #    class:
            #        - 'left'
            #        - 'right'
            #    iou_thresh:
            #        0.9

device: 
    path: 'utils/device.yaml'

log:
    folder: 'log'
    level: INFO

throttled_logger:
    log_interval: 60

csv:
    save_dir: 'log/csv'
    output_path: null  # null 會自動產生路徑, 有指定的話檔名會加上後綴 "_result" 且會覆蓋同名檔

video:
    # 原始影片
    origin: 
        enable: false  # 要不要啟動錄影 (不管其他參數)
        base_dir: log/record/stream
        frame_w: 640
        frame_h: 480
        fps: 30
        gop: 60
        periods: [
            [0, 24]
        ]
        bitrate: 2
        suffix: ''
        output_path: null  # null 會自動產生路徑, 有指定的話檔名會加上後綴 "_result" 且會覆蓋同名檔

    # 結果影片
    result:
        enable: true  # 要不要啟動錄影 (不管其他參數)
        base_dir: log/record/stream
        frame_w: 640
        frame_h: 480
        fps: 30
        gop: 120
        periods: [
            [0, 24]
        ]
        bitrate: 1.5
        suffix: '_result'
        output_path: null  # null 會自動產生路徑, 有指定的話檔名會加上後綴 "_result" 且會覆蓋同名檔

visualization:
    bbox:
        omit_classes: []
            #- 'left'
            #- 'right'
            #- 'gloved hand'
            #- 'alcohol nozzle'
            #- 'nail brush'
            #- 'paper towel'
            #- 'air outlet'
            #- 'brush tray'
            #- 'faucet'
            #- 'sink'
            #- 'soap dispenser'
        bbox_thickness: 2
        plot_score: false
        font_scale: 0.35
        font_thickness: 1
        text_padding: 1
    
    timestamp:
        font_scale: 0.55
        thickness: 2
        shadow_offset: 2

    result:
        mode: 'center'
        stay_time: 2  # 秒
        num_block: 2

logic:
    parameter:  # 我自己用的參數
        trigger_step1_8_buffer: 30
        trigger_step2_buffer: 20
        trigger_step3_6_buffer: 20
        trigger_step7_buffer: 20
        trigger_step9_buffer: 10
        trigger_step10_buffer: 20
        trigger_step11_buffer: 20
        trigger_step12_buffer: 20

        # 換算
        step3_frame_scrub_ratio: 7
        step4_frame_scrub_ratio: 7
        step5_frame_scrub_ratio: 7
        step6_frame_scrub_ratio: 20
        step7_frame_scrub_ratio: 10

        step3_min_scrub: 10
        step4_min_scrub: 10
        step5_min_scrub: 10
        step6_min_scrub: 10
        step7_min_scrub: 10

        scrub_min_frames: 3           # Step 3-7: 持續幾幀
        no_hand_timeout: 3          # 消失幾秒後結束 Session
        scrub_flag_count: 5           # 搓洗幾次完成
        hand_wash_iou: 0.3            # Step 3-7 判定用
        max_hand_ratio: 1.            # 手部佔畫面比例上限
        move_dir_thresh: 0.05         # 搓洗位移門檻
        scrub_overlap_thresh: 0.2     # Step 12 雙手重疊門檻
        glove_iou_thresh: 0.2         # 手套判定門檻
        min_repeat_interval: 10       # 相同步驟連續觸發必須要超過一定秒數

    # 秒數相關
    time_parameter:
        time_scale: 0.1666            # 因為 server 跑速快很多
        trigger_pause: 1.0            # trigger 後多久切到下一步驟
        pub_no_hand_delay: 1.0        # 連續幾秒沒手後才開始通知系統

    # 前端和我共用的參數
    system_parameter: 'wash_steps.json'

    class:
        hand:
            - 'left'
            - 'right'
        gloved hand:
            - 'gloved hand'
        #device:
        #    - 'air outlet'
        #    - 'brush tray'
        #    - 'faucet'
        #    - 'sink'
        #    - 'soap dispenser'
        ai_logic_labels:
            step1_8: 'handwash'
            step2: 'trigger soap dispenser'
            step7: 'scrub under nails'
            step9: 'wipe hands with tissue'
            step10: 'UV sterilization'
            step11: 'spray alcohol'
        handwash:  # 計算搓洗次數的步驟
            - 'palm to palm'
            - 'palm over back'
            - 'interlaced fingers'
            - 'thumb or wrist scrub'
            #- 'scrub under nails'
        #nail brush:
        #    - 'nail brush'
        #paper towel:
        #    - 'paper towel'
        #alcohol nozzle:
        #    - 'alcohol nozzle'

udp:
    ip: '127.0.0.1'
    port: 10039

mqtt:
    ip: '127.0.0.1'
    port: 1883
    client_id: null
    reconnect_interval: 5  # 秒
    topic:
        publish:
            system: 'handwash/system'
            process: 'handwash/process'
        subscribe:
            system: 'handwash/system'
    sub_cmds:  # 訂閱的指令
        - 'Login'
        - 'ResetFinish'
    qos: 0
    pub_freq: 150